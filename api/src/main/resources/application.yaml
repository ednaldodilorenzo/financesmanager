spring:
  application:
    name: api
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 2048
  mvc:
    converters:
      preferred-json-mapper: jackson
  jackson:
    parser:
      allow-non-numeric-numbers: true
  jpa:
    properties:
      hibernate:
        default_schema: public
#        show_sql: true
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: none
  threads:
    virtual:
      enabled: true

server:
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json

management:
  server:
    port: 8280
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

csv:
  layouts:
    BBCA:
      header-lines: 2
      footer-lines: 1
      payment-date-column: 0
      transaction-date-column: 0
      ammount-column: 4
      date-pattern: dd/MM/yyyy
      delimiter: ","
      description-column: 1
    C6CC:
      header-lines: 1
      footer-lines: 0
      payment-date-column: 0
      transaction-date-column: 0
      ammount-column: 8
      date-pattern: dd/MM/yyyy
      delimiter: ";"
      description-column: 4
    BBMF:
      header-lines: 1
      footer-lines: 0
      payment-date-column: 2
      transaction-date-column: 2
      ammount-column: 1
      date-pattern: dd/MM/yyyy
      delimiter: ";"
      description-column: 0