services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - type: bind
        source: ${LOKI_CONFIG_PATH:-./observability/loki.yml}
        target: /etc/loki/config.yml
        read_only: true
        bind:
          create_host_path: false
      - loki_data:/loki

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - type: bind
        source: ${ALLOY_CONFIG_PATH:-./observability/config.alloy}
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

  worker:
    image: ednaldodilorenzo/financemanager-worker:${IMAGE_TAG:-latest}
    depends_on:
      - redis
    environment:
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MB_HOST=${MB_HOST}
      - MB_PORT=${MB_PORT}

  app:
    image: ednaldodilorenzo/financemanager-api:${IMAGE_TAG:-latest}
    labels:
      logging: "enabled"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - APP_JWT_KEY=${JWT_KEY}
      - APP_PUBLIC_ID_ALPHABET=${PUBLIC_ID_ALPHABET}
      - SPRINT_DATA_REDIS_HOST=${MB_HOST}
      - SPRINT_DATA_REDIS_PORT=${MB_PORT}
    depends_on:
      - db
    expose:
      - "8080"

  #api:
  #  build:
  #    context: ./server
  #  environment:
  #    - DB_USERNAME=${DB_USERNAME}
  #    - DB_PASSWORD=${DB_PASSWORD}
  #    - DB_HOST=${DB_HOST}
  #    - DB_PORT=${DB_PORT}
  #    - DB_NAME=${DB_NAME}
  #    - MB_HOST=${MB_HOST}
  #    - MB_PORT=${MB_PORT}
  #    - APP_URL=${APP_URL}
  #    - APP_JWT_KEY=${JWT_KEY}
  #    - APP_ENVIRONMENT=PRODUCTION
  #    - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
  #    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
  #    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
  #  depends_on:
  #    - db
  #    - migrate
  #  expose:
  #    - "5000"

  client:
    image: ednaldodilorenzo/financemanager-web:${IMAGE_TAG:-latest}
    ports:
      - "443:443"
    volumes:
      - ${CERT_PATH}:/certs:ro
    depends_on:
      - app

#  migrate:
#    image: migrate/migrate
#    volumes:
#      - ./database/migrations:/migrations
#    environment:
#      - DB_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
#    # The entrypoint waits for 'db' on port 5432 before running the migration
#    entrypoint: >
#      sh -c "while ! nc -z db 5432; do
#               echo 'Waiting for database...';
#               sleep 1;
#             done;
#             /migrate -path=/migrations/ -database $$DB_URL up"
#    depends_on:
#      - db

  db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      # This file is copied to VPS as part of github action.
      - ${PROMETHEUS_CONFIG_PATH:-./observability/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: grafana.financecockpit.com.br
      GF_SERVER_ROOT_URL: https://grafana.financecockpit.com.br
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_PROTOCOL: http
    ports:
      - "3000:3000" # 3000 is default, remap to avoid clash with app
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
