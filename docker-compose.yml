services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  worker:
    image: ednaldodilorenzo/financemanager-worker:latest
    depends_on:
      - redis
    environment:
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MB_HOST=${MB_HOST}
      - MB_PORT=${MB_PORT}

  app:
    image: ednaldodilorenzo/financemanager-api:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - APP_JWT_KEY=${JWT_KEY}
    depends_on:
      - db
    expose:
      - "8080"

  #api:
  #  build:
  #    context: ./server
  #  environment:
  #    - DB_USERNAME=${DB_USERNAME}
  #    - DB_PASSWORD=${DB_PASSWORD}
  #    - DB_HOST=${DB_HOST}
  #    - DB_PORT=${DB_PORT}
  #    - DB_NAME=${DB_NAME}
  #    - MB_HOST=${MB_HOST}
  #    - MB_PORT=${MB_PORT}
  #    - APP_URL=${APP_URL}
  #    - APP_JWT_KEY=${JWT_KEY}
  #    - APP_ENVIRONMENT=PRODUCTION
  #    - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
  #    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
  #    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
  #  depends_on:
  #    - db
  #    - migrate
  #  expose:
  #    - "5000"

  client:
    image: ednaldodilorenzo/financemanager-web:latest
    ports:
      - "443:443"
    volumes:
      - ${CERT_PATH}:/certs:ro
    depends_on:
      - app

  migrate:
    image: migrate/migrate
    volumes:
      - ./database/migrations:/migrations
    environment:
      - DB_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    # The entrypoint waits for 'db' on port 5432 before running the migration
    entrypoint: >
      sh -c "while ! nc -z db 5432; do
               echo 'Waiting for database...';
               sleep 1;
             done;
             /migrate -path=/migrations/ -database $$DB_URL up"
    depends_on:
      - db

  db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  #prometheus:
