name: Build, Push and Deploy

on:
  release:
    types: [published]

env:
  REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: api
            image: financemanager-api
          - context: client
            image: financemanager-web
          - context: taskexecutor
            image: financemanager-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:latest
          build-args: |
            VUE_APP_VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKER_HOST: ssh://root@147.93.35.35
      IMAGE_TAG: ${{ github.event.release.tag_name }}
      APP_URL: ${{ secrets.APP_URL }}
      CERT_PATH: ${{ secrets.CERT_PATH }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      MB_HOST: ${{ secrets.MB_HOST }}
      MB_PORT: ${{ secrets.MB_PORT }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      PROMETHEUS_CONFIG_PATH: /opt/financemanager/observability/prometheus.yml
      LOKI_CONFIG_PATH: /opt/financemanager/observability/loki.yml
      ALLOY_CONFIG_PATH: /opt/financemanager/observability/config.alloy
      ALLOY_VERSION: v1.20.1      
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 147.93.35.35 >> ~/.ssh/known_hosts

      - name: Copy Observability configuration to VPS
        run: |
          test -f observability/prometheus.yml

          ssh root@147.93.35.35 \
            'mkdir -p /opt/financemanager/observability'

          scp observability/prometheus.yml observability/loki.yml observability/config.alloy \
            root@147.93.35.35:/opt/financemanager/observability/

          ssh root@147.93.35.35 \
            'test -f /opt/financemanager/observability/prometheus.yml'
      
      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

