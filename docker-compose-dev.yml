#    ports:
#      - "5000:5000"
#      - "2345:2345"

  app:
    build:
      context: ./api
      dockerfile: Dockerfile-dev
    volumes:
      - ./api/src/main:/workspace/src/main
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - DEBUG_PORT=5005
    develop:
      watch:
        - path: ./api/build.gradle.kts
          action: rebuild

  client:
    build:
      context: ./client
      dockerfile: Dockerfile-dev
    ports:
      - "8180:8080"
    volumes:
      - ./client:/app
      - /app/node_modules

  worker:
    build:
      context: ./taskexecutor

  db:
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  go-mod-cache:
  go-build-cache:
