# Este arquivo deve ser incluído no contexto http do nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream docker-web {
    server app:8080;
}

upstream docker-grafana {
    server grafana:3000;
}

# Frontend e backend
server {
    include /etc/nginx/extra-conf.d/*.conf;

    listen 443 ssl;
    http2 on;
    server_name financecockpit.com.br;

    ssl_certificate /certs/live/financecockpit.com.br/fullchain.pem;
    ssl_certificate_key /certs/live/financecockpit.com.br/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    location /api/ {
        proxy_pass http://docker-web;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
}

# Grafana
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.financecockpit.com.br;

    ssl_certificate /certs/live/financecockpit.com.brfullchain.pem;
    ssl_certificate_key /certs/live/financecockpit.com.br/privkey.pem;

    location / {
        proxy_pass http://docker-grafana;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket utilizado pelo Grafana Live
    location /api/live/ {
        proxy_pass http://docker-grafana;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}